<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Game | Home</title>
</head>

<body>
    <main>
        <div id="content-inicial">
            <h1>Pedra, Papel ou Tesoura</h1>
            <p>Clique no botão abaixo para poder iniciar!</p>

            <button onclick="iniciar()" class="btns">Inicar partida!</button>
        </div>

        <div id="content-game" class="esconder">
            <h2>Selecione uma opção:</h2>

            <div class="select-btn">
                <button class="img-opcao" onclick="selecionar(1)">
                    <img src="./img/pedra.png" alt="Pedra">
                </button>
                <button class="img-opcao" onclick="selecionar(2)">
                    <img src="./img/papel.png" alt="Papel">
                </button>
                <button class="img-opcao" onclick="selecionar(3)">
                    <img src="./img/tesoura.png" alt="Tesoura">
                </button>
            </div>
        </div>

        <div id="content-resumo" class="esconder">
            <h2>Rodada <span id="contador-rodada">1</span> de 3</h2>

            <div class="batalha-container">
                <p>User jogou: <strong id="jogada-user">...</strong></p>
                <p>Mini jogou: <strong id="jogada-mini">...</strong></p>
                <h3 id="resultado-rodada-atual" class="mensagem-rodada">Você venceu a rodada!</h3>
            </div>

            <button class="btns" id="btn-proximo" onclick="avancarJogo()">Próxima Rodada</button>
            <button class="btns esconder" id="btn-finalizar" onclick="finalizarPartida()">Finalizar Partida</button>
        </div>

        <div id="content-placar" class="esconder">
            <h3>Placar:</h3>

            <span id="mensagemResult">[Default]</span>

            <div class="mini-historico">
                <h4>Histórico da Partida:</h4>
                <ul>
                    <li>1ª Rodada: <span id="historico-r1">-</span></li>
                    <li>2ª Rodada: <span id="historico-r2">-</span></li>
                    <li>3ª Rodada: <span id="historico-r3">-</span></li>
                </ul>
            </div>


            <button class="btns" onclick="recomecar()">Jogar Novamente</button>
        </div>
    </main>

    <script src="./main.js"></script>
</body>

</html>
